<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROCKPAPERSCISSORS</title>
</head>
<body>
<script>
let userChoice;
let userScore = 0;
let computerScore = 0;
let computerChoice = () => Math.floor(Math.random()*3);
const body = document.querySelector("body");
const button1 = document.createElement("button");
const button2 = document.createElement("button");
const button3 = document.createElement("button");
button1.textContent = 'rock';
button2.textContent = 'paper';
button3.textContent = 'scissors';
body.appendChild(button1);
body.appendChild(button2);
body.appendChild(button3);

button1.addEventListener('click', () => rps('rock'));
button2.addEventListener('click', () => rps('paper'));
button3.addEventListener('click', () => rps("scissors"));

const scoreBoard = document.createElement('p');
const thisRound = document.createElement("p");

thisRound.textContent = `let's play suckers!`
body.appendChild(thisRound)
body.appendChild(scoreBoard);
scoreBoard.textContent = `user: ${userScore}; computer: ${computerScore}`;

function realTalk() {
scoreBoard.textContent = `user: ${userScore}; computer: ${computerScore}`;
}


let user2num = choice => {
  userChoice = choice.toLowerCase();
    switch(userChoice) {
      case "rock":
        userChoice = 0;
        break;
      case "paper":
        userChoice = 1;
        break;
      case "scissors":
        userChoice = 2;
        break;
      default: 
        userChoice = 3;
    }
  }

function rps(choice) {
  if(userScore == 5 || computerScore == 5){
    userScore = 0;
    computerScore = 0;
  }

  botsTurn = computerChoice();
  user2num(choice);
  if (userChoice == botsTurn) {
    thisRound.textContent = "TIE";
  } else if (
    (userChoice == 0 && botsTurn == 1) || 
    (userChoice == 1 && botsTurn == 2) || 
    (userChoice == 2 && botsTurn == 0)
    ) {
    thisRound.textContent = "loser :(";
    computerScore++;
  } else {
    thisRound.textContent = "good luck!";
    userScore++
  }
  if (computerScore == 5) {
    thisRound.textContent = "thas' it human u looooose";
    realTalk();
  } else if (userScore == 5) {
    thisRound.textContent = "user ur the beeest!111!!!! :D :D \<3";
    realTalk();
  }
  scoreBoard.textContent = `user: ${userScore}; computer: ${computerScore}`;
}




</script>
</body>
</html>
